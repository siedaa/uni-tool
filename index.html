<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasdaran Contribution Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .contribution-cell { min-width: 80px; text-align: center; font-size: 0.85rem; transition: all 0.2s; }
        .missing-payment { color: #cbd5e1; }
        .has-payment { color: #059669; font-weight: 600; background-color: #ecfdf5; }
        .table-container::-webkit-scrollbar { height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sticky-col { position: sticky; left: 0; background: white; z-index: 10; border-right: 1px solid #e2e8f0; }
        tr:hover .sticky-col { background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-95">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 text-center">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Pasdaran Finance Portal</h1>
            <form id="loginForm" class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Access Password" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-all">Login</button>
                <p id="loginError" class="text-red-500 text-sm hidden">Access Denied.</p>
            </form>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="mainContent" class="hidden">
        <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
            <div class="max-w-[1600px] mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900">Contribution Ledger</h1>
                </div>
                
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex bg-gray-100 rounded-xl p-1">
                        <button onclick="updateType('S')" id="btnS" class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all bg-white shadow-sm text-blue-600">Sisters</button>
                        <button onclick="updateType('B')" id="btnB" class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-gray-500">Brothers</button>
                    </div>
                    <select id="yearFilter" onchange="renderDashboard()" class="bg-white border border-gray-200 text-sm font-bold rounded-xl px-4 py-2 outline-none">
                        <option value="25-26">2025-2026</option>
                        <option value="24-25">2024-2025</option>
                    </select>
                    <input type="text" id="nameSearch" oninput="renderDashboard()" placeholder="Search..." class="px-4 py-2 border rounded-xl text-sm outline-none w-48 shadow-sm">
                    <button onclick="logout()" class="text-gray-400 hover:text-red-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg></button>
                </div>
            </div>
        </header>

        <main class="max-w-[1600px] mx-auto px-6 py-8 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card p-6 rounded-3xl border-l-4 border-l-blue-600"><p class="text-xs font-bold text-gray-400 uppercase">Total Collected</p><p class="text-3xl font-black mt-2" id="statTotal">PKR 0</p></div>
                <div class="glass-card p-6 rounded-3xl border-l-4 border-l-emerald-500"><p class="text-xs font-bold text-gray-400 uppercase">Active Members</p><p class="text-3xl font-black text-emerald-600 mt-2" id="statMembers">0</p></div>
                <div class="glass-card p-6 rounded-3xl border-l-4 border-l-amber-500"><p class="text-xs font-bold text-gray-400 uppercase">Avg / Member</p><p class="text-3xl font-black text-amber-600 mt-2" id="statAvg">PKR 0</p></div>
            </div>
            <div id="tableSection" class="min-h-[400px]"></div>
        </main>
    </div>

    <script>
        let allData = [];
        let currentType = 'S';

        // Update these if your CSV filenames change
        const FILE_PATHS = [
            { type: 'S', year: '25-26', path: 'Pasdaran Monthly Contribution Report.xlsx - S(25-26).csv' },
            { type: 'S', year: '24-25', path: 'Pasdaran Monthly Contribution Report.xlsx - S(24-25).csv' },
            { type: 'B', year: '25-26', path: 'Pasdaran Monthly Contribution Report.xlsx - B(25-26).csv' },
            { type: 'B', year: '24-25', path: 'Pasdaran Monthly Contribution Report.xlsx - B(24-25).csv' }
        ];

        async function loadData() {
            allData = [];
            for (const file of FILE_PATHS) {
                try {
                    const response = await fetch(file.path);
                    if (!response.ok) continue;
                    const text = await response.text();
                    parseCSV(text, file.type, file.year);
                } catch (e) { console.error("Error loading " + file.path, e); }
            }
            renderDashboard();
        }

        function parseCSV(text, type, year) {
            const lines = text.split('\n').map(l => l.split(','));
            let dateRowIndex = lines.findIndex(row => row.join(',').includes('2024-') || row.join(',').includes('2025-'));
            if (dateRowIndex === -1) return;

            const dates = lines[dateRowIndex].map(d => d.substring(0, 7));
            
            for (let i = dateRowIndex + 2; i < lines.length; i++) {
                const row = lines[i];
                if (!row || row.length < 3) continue;
                let name = row[1]?.trim();
                if (!name || name === '#REF!' || name === 'Names' || !isNaN(name)) continue;

                const contributions = {};
                dates.forEach((date, idx) => {
                    if (date.startsWith('202')) {
                        const val = parseFloat(row[idx]?.replace(/[^0-9.]/g, '')) || 0;
                        contributions[date] = val;
                    }
                });

                allData.push({ name, type, year, contributions });
            }
        }

        function renderDashboard() {
            const year = document.getElementById('yearFilter').value;
            const search = document.getElementById('nameSearch').value.toLowerCase();
            const filtered = allData.filter(m => m.type === currentType && m.year === year && m.name.toLowerCase().includes(search));
            
            let total = 0;
            filtered.forEach(m => Object.values(m.contributions).forEach(v => total += v));
            document.getElementById('statTotal').innerText = `PKR ${total.toLocaleString()}`;
            document.getElementById('statMembers').innerText = filtered.length;
            document.getElementById('statAvg').innerText = `PKR ${filtered.length ? Math.round(total/filtered.length).toLocaleString() : 0}`;

            const startYear = year === '24-25' ? '2024' : '2025';
            const endYear = year === '24-25' ? '2025' : '2026';
            const months = [`${startYear}-09`,`${startYear}-10`,`${startYear}-11`,`${startYear}-12`,`${endYear}-01`,`${endYear}-02`,`${endYear}-03`,`${endYear}-04`,`${endYear}-05`,`${endYear}-06`,`${endYear}-07`,`${endYear}-08`];

            const html = `
                <div class="glass-card rounded-3xl overflow-hidden shadow-sm overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50/50">
                            <tr>
                                <th class="px-6 py-4 sticky-col bg-gray-50/50 text-[10px] font-black uppercase text-gray-400">Name</th>
                                ${months.map(m => `<th class="px-3 py-4 text-center text-[10px] font-black uppercase text-gray-400">${m.split('-')[1]}</th>`).join('')}
                                <th class="px-6 py-4 text-right text-[10px] font-black uppercase text-gray-400">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map(m => {
                                let rowTotal = 0;
                                return `
                                    <tr class="hover:bg-gray-50/50 border-t border-gray-100">
                                        <td class="px-6 py-4 font-bold text-gray-800 sticky-col bg-white text-sm">${m.name}</td>
                                        ${months.map(mon => {
                                            const amt = m.contributions[mon] || 0;
                                            rowTotal += amt;
                                            return `<td class="px-3 py-4 contribution-cell ${amt > 0 ? 'has-payment' : 'missing-payment'}">${amt > 0 ? amt : '—'}</td>`;
                                        }).join('')}
                                        <td class="px-6 py-4 text-right font-black text-gray-900 bg-gray-50/20">PKR ${rowTotal}</td>
                                    </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>`;
            document.getElementById('tableSection').innerHTML = filtered.length ? html : '<div class="text-center py-20 text-gray-400">No data found</div>';
        }

        function updateType(t) {
            currentType = t;
            document.getElementById('btnS').className = t === 'S' ? "px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-blue-600" : "px-4 py-1.5 rounded-lg text-sm font-bold text-gray-500";
            document.getElementById('btnB').className = t === 'B' ? "px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-blue-600" : "px-4 py-1.5 rounded-lg text-sm font-bold text-gray-500";
            renderDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('passwordInput').value === "org123") {
                sessionStorage.setItem('isLoggedIn', 'true');
                showDashboard();
            } else { document.getElementById('loginError').classList.remove('hidden'); }
        });

        function showDashboard() {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            loadData();
        }

        function logout() { sessionStorage.removeItem('isLoggedIn'); location.reload(); }
        window.onload = () => { if (sessionStorage.getItem('isLoggedIn') === 'true') showDashboard(); };
    </script>
</body>
</html>
