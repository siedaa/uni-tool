<!DOCTYPE html>
<html>
<head>
  <title>University Lookup Tool</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    }

    h2 {
      color: #333;
    }

    input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #4facfe;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #00c6ff;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Exam Seating Lookup</h2>

    <input type="number" id="rollInput" placeholder="Enter Roll Number">
    <br>
    <button onclick="findSeat()">Find Seat</button>

    <p id="result"></p>
  </div>

  <script>
    const data = [
      { roll: 101, room: "A-12", seat: 5 },
      { roll: 102, room: "B-3", seat: 9 },
      { roll: 103, room: "C-7", seat: 1 },
      { roll: 104, room: "D-2", seat: 6 },
      { roll: 105, room: "E-4", seat: 3 }
    ];

    function findSeat() {
      const rollNo = document.getElementById("rollInput").value;
      let found = false;

      for (let i = 0; i < data.length; i++) {
        if (data[i].roll == rollNo) {
          document.getElementById("result").innerText =
            "Room: " + data[i].room + " | Seat: " + data[i].seat;
          found = true;
          break;
        }
      }

      if (!found) {
        document.getElementById("result").innerText =
          "Roll number not found!";
      }
    }
  </script>

</body>
</html>
